services:
  volumes-provisioner:
    image: hasnat/volumes-provisioner
    environment:
      PROVISION_DIRECTORIES: "1000:1000:0755:/tmp/certs"
    volumes:
      - "./certs:/tmp/certs"
    network_mode: none

  cert-gen:
    image: docker.kurrent.io/eventstore-utils/es-gencert-cli:1.2
    entrypoint: bash
    user: "1000:1000"
    command: >
      -c "mkdir -p ./certs
      && cd /certs
      && rm -rfv ./ca
      && rm -rfv ./node1
      && rm -rfv ./node2
      && rm -rfv ./node3
      && es-gencert-cli create-ca
      && es-gencert-cli create-node -out ./node1 -ip-addresses 127.0.0.1,172.30.240.11 -dns-names localhost
      && es-gencert-cli create-node -out ./node2 -ip-addresses 127.0.0.1,172.30.240.12 -dns-names localhost
      && es-gencert-cli create-node -out ./node3 -ip-addresses 127.0.0.1,172.30.240.13 -dns-names localhost"
      && find . -type d -exec chmod 755 {} \;
      && find . -type f -name '*.key' -exec chmod 644 {} \;
      && find . -type f -name '*.crt' -exec chmod 644 {} \;
#      && find . -type f -print0 | xargs -0 chmod 666"
    volumes:
      - "./certs:/certs"
    depends_on:
      - volumes-provisioner

  kurrentdb-node1:
    image: ${KURRENTDB_DOCKER_IMAGE}
    env_file:
      - shared.env
    environment:
      - KURRENTDB_GOSSIP_SEED=172.30.240.12:2113,172.30.240.13:2113
      - KURRENTDB_REPLICATION_IP=172.30.240.11
      - KURRENTDB_CERTIFICATE_FILE=/etc/eventstore/certs/node1/node.crt
      - KURRENTDB_CERTIFICATE_PRIVATE_KEY_FILE=/etc/eventstore/certs/node1/node.key
      - KURRENTDB_ADVERTISE_HOST_TO_CLIENT_AS=127.0.0.1
      - KURRENTDB_ADVERTISE_NODE_PORT_TO_CLIENT_AS=2110
      - EVENTSTORE_GOSSIP_SEED=172.30.240.12:2113,172.30.240.13:2113
      - EVENTSTORE_REPLICATION_IP=172.30.240.11
      - EVENTSTORE_CERTIFICATE_FILE=/etc/eventstore/certs/node1/node.crt
      - EVENTSTORE_CERTIFICATE_PRIVATE_KEY_FILE=/etc/eventstore/certs/node1/node.key
      - EVENTSTORE_ADVERTISE_HOST_TO_CLIENT_AS=127.0.0.1
      - EVENTSTORE_ADVERTISE_NODE_PORT_TO_CLIENT_AS=2110
    ports:
      - 1110:1113
      - 2110:2113
    networks:
      clusternetwork:
        ipv4_address: 172.30.240.11
    volumes:
      - ./certs:/etc/eventstore/certs
    restart: unless-stopped
    depends_on:
      cert-gen:
        condition: service_completed_successfully

  kurrentdb-node2:
    image: ${KURRENTDB_DOCKER_IMAGE}
    env_file:
      - shared.env
    environment:
      - KURRENTDB_GOSSIP_SEED=172.30.240.11:2113,172.30.240.13:2113
      - KURRENTDB_REPLICATION_IP=172.30.240.12
      - KURRENTDB_CERTIFICATE_FILE=/etc/eventstore/certs/node2/node.crt
      - KURRENTDB_CERTIFICATE_PRIVATE_KEY_FILE=/etc/eventstore/certs/node2/node.key
      - KURRENTDB_ADVERTISE_HOST_TO_CLIENT_AS=127.0.0.1
      - KURRENTDB_ADVERTISE_NODE_PORT_TO_CLIENT_AS=2111
      - EVENTSTORE_GOSSIP_SEED=172.30.240.11:2113,172.30.240.13:2113
      - EVENTSTORE_REPLICATION_IP=172.30.240.12
      - EVENTSTORE_CERTIFICATE_FILE=/etc/eventstore/certs/node2/node.crt
      - EVENTSTORE_CERTIFICATE_PRIVATE_KEY_FILE=/etc/eventstore/certs/node2/node.key
      - EVENTSTORE_ADVERTISE_HOST_TO_CLIENT_AS=127.0.0.1
      - EVENTSTORE_ADVERTISE_NODE_PORT_TO_CLIENT_AS=2111
    ports:
      - 1111:1113
      - 2111:2113
    networks:
      clusternetwork:
        ipv4_address: 172.30.240.12
    volumes:
      - ./certs:/etc/eventstore/certs
    restart: unless-stopped
    depends_on:
      cert-gen:
        condition: service_completed_successfully

  kurrentdb-node3:
    image: ${KURRENTDB_DOCKER_IMAGE}
    env_file:
      - shared.env
    environment:
      - KURRENTDB_GOSSIP_SEED=172.30.240.11:2113,172.30.240.12:2113
      - KURRENTDB_REPLICATION_IP=172.30.240.13
      - KURRENTDB_CERTIFICATE_FILE=/etc/eventstore/certs/node3/node.crt
      - KURRENTDB_CERTIFICATE_PRIVATE_KEY_FILE=/etc/eventstore/certs/node3/node.key
      - KURRENTDB_ADVERTISE_HOST_TO_CLIENT_AS=127.0.0.1
      - KURRENTDB_ADVERTISE_NODE_PORT_TO_CLIENT_AS=2112
      - EVENTSTORE_GOSSIP_SEED=172.30.240.11:2113,172.30.240.12:2113
      - EVENTSTORE_REPLICATION_IP=172.30.240.13
      - EVENTSTORE_CERTIFICATE_FILE=/etc/eventstore/certs/node3/node.crt
      - EVENTSTORE_CERTIFICATE_PRIVATE_KEY_FILE=/etc/eventstore/certs/node3/node.key
      - EVENTSTORE_ADVERTISE_HOST_TO_CLIENT_AS=127.0.0.1
      - EVENTSTORE_ADVERTISE_NODE_PORT_TO_CLIENT_AS=2112
    ports:
      - 1112:1113
      - 2112:2113
    networks:
      clusternetwork:
        ipv4_address: 172.30.240.13
    volumes:
      - ./certs:/etc/eventstore/certs
    restart: unless-stopped
    depends_on:
      cert-gen:
        condition: service_completed_successfully

networks:
  clusternetwork:
    name: kurrentdb.local
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.30.240.0/24
